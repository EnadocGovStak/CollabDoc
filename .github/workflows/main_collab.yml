# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Collab

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: collabdocweb
  AZURE_RESOURCE_GROUP: collabdoc
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies for all projects
        run: |
          npm install
          cd frontend && npm install
          cd ../backend && npm install

      - name: Build application
        env:
          NODE_ENV: production
          REACT_APP_API_BASE_URL: ''
          REACT_APP_SYNCFUSION_LICENSE_KEY: ${{ secrets.REACT_APP_SYNCFUSION_LICENSE_KEY }}
        run: npm run build

      - name: Test backend
        run: |
          cd backend
          if node -e "const pkg=require('./package.json'); const testScript=pkg.scripts && pkg.scripts.test; process.exit(testScript && !testScript.includes('no test specified') ? 0 : 1)"; then
            npm test
          else
            echo "Skipping backend tests because no real backend test script is configured."
          fi

      - name: Zip backend with frontend for deployment
        run: |
          cd backend
          zip -r ../release.zip . -x "node_modules/*" "*.log"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_082CE0ACB88148CAB2EEA75FA40B5C25 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_78A8038E871C4FDEAB89BE437679D6DF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_76E14732AEB64CEA975F947A3019625D }}

      - name: Configure Azure Web App settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                NODE_ENV=production \
                STORAGE_ROOT=/home/site/data/collabdoc

            az webapp config set \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --startup-file "npm start"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: .
          